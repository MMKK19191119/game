<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>인베이더</title>
<style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh}canvas{border:1px solid #333}</style>
</head><body><canvas id="c" width="480" height="560"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),k={};
onkeydown=e=>{k[e.code]=1;if(e.code=='Space')e.preventDefault();if(over&&e.code=='Enter')init()};
onkeyup=e=>k[e.code]=0;
let p,b,a,eb,dir,score,over,cd;
function init(){p={x:220};b=[];eb=[];a=[];dir=1;score=0;over=0;cd=0;
for(let r=0;r<4;r++)for(let i=0;i<8;i++)a.push({x:40+i*50,y:50+r*40});}
function loop(){
if(!over){
if(k.ArrowLeft)p.x-=4;if(k.ArrowRight)p.x+=4;p.x=Math.max(0,Math.min(440,p.x));
if(k.Space&&cd<=0){b.push({x:p.x+18,y:510});cd=20}cd--;
b.forEach(o=>o.y-=7);b=b.filter(o=>o.y>0);
let edge=a.some(o=>o.x+dir>450||o.x+dir<0);
a.forEach(o=>{if(edge)o.y+=15;else o.x+=dir*(1+(32-a.length)/8)});if(edge)dir*=-1;
if(a.length&&Math.random()<.02){let s=a[Math.random()*a.length|0];eb.push({x:s.x+13,y:s.y+20})}
eb.forEach(o=>o.y+=4);eb=eb.filter(o=>o.y<560);
b.forEach(o=>a.forEach(e=>{if(o.x>e.x&&o.x<e.x+30&&o.y>e.y&&o.y<e.y+20){e.d=o.d=1;score+=10}}));
a=a.filter(e=>!e.d);b=b.filter(o=>!o.d);
if(eb.some(o=>o.x>p.x&&o.x<p.x+40&&o.y>510)||a.some(e=>e.y>480))over=1;
if(!a.length)init(),score=score;}
x.fillStyle='#000';x.fillRect(0,0,480,560);
x.fillStyle='#0f0';x.fillRect(p.x,515,40,15);
x.fillStyle='#fff';b.forEach(o=>x.fillRect(o.x,o.y,3,10));
x.fillStyle='#f44';eb.forEach(o=>x.fillRect(o.x,o.y,3,10));
x.font='22px monospace';a.forEach(e=>x.fillText('👾',e.x,e.y+20));
x.fillStyle='#fff';x.font='16px monospace';x.fillText('SCORE '+score,10,20);
if(over){x.font='30px monospace';x.fillText('GAME OVER',160,280);x.font='16px monospace';x.fillText('Enter: 다시하기',175,310)}
requestAnimationFrame(loop)}
init();loop();
</script></body></html>
